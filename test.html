<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer List</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #eef3f7;
      padding: 2rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #1a237e;
      margin-bottom: 2rem;
    }
    .actions {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .actions button {
      padding: 0.6rem 1.2rem;
      background-color: #3949ab;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    .actions button:hover {
      background-color: #303f9f;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 10px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .modal-content h2 {
      margin-top: 0;
      color: #1a237e;
    }
    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 1rem;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #000;
    }
    form input, form select, form button {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    form button {
      background-color: #1e88e5;
      color: white;
      border: none;
      cursor: pointer;
    }
    form button:hover {
      background-color: #1565c0;
    }
    table.display {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    table.display th, table.display td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }
    table.display th {
      background-color: #f0f0f0;
    }
    table.display tbody tr:hover {
      background-color: #f9f9f9;
    }
    a {
      color: #1e88e5;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .delete-btn {
      background-color: #e53935;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .delete-btn:hover {
      background-color: #c62828;
    }
  </style>
</head>
<body>
  <h1>Customer List</h1>
  <div class="actions">
    <button onclick="showAddCustomerForm()">➕ Add New Customer</button>
  </div>
  <table id="customerTable" class="display">
    <thead>
      <tr>
        <th>SSN</th>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Occupation</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="customerBody"></tbody>
  </table>

  <div id="customerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Customer Details</h2>
      <div id="modalDetails"></div>
    </div>
  </div>

  <div id="addCustomerModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAddCustomerModal()">&times;</span>
      <h2>Add New Customer</h2>
      <form id="addCustomerForm">
        <input type="text" id="newSSN" placeholder="SSN" required>
        <input type="text" id="newName" placeholder="Name" required>
        <input type="email" id="newEmail" placeholder="Email" required>
        <input type="text" id="newContact" placeholder="Contact" required>
        <input type="text" id="newOccupation" placeholder="Occupation" required>
        <button type="submit">Add Customer</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script>
    let dataTable;
    const customers = [
      { ssn: "123-45-6789", name: "John Doe", email: "john@example.com", contact: "9876543210", occupation: "Engineer" },
      { ssn: "987-65-4321", name: "Jane Smith", email: "jane@example.com", contact: "8765432109", occupation: "Teacher" }
    ];

    function populateTable() {
      const tbody = document.getElementById("customerBody");
      tbody.innerHTML = "";

      customers.forEach((c, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${c.ssn}</td>
          <td><a href="#" onclick="showModal(${index})">${c.name}</a></td>
          <td>${c.email}</td>
          <td>${c.contact}</td>
          <td>${c.occupation}</td>
          <td><button class="delete-btn" onclick="deleteCustomer(${index})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

      if (!$.fn.DataTable.isDataTable("#customerTable")) {
        dataTable = $('#customerTable').DataTable();
      }
    }

    function showModal(index) {
      const c = customers[index];
      document.getElementById("modalDetails").innerHTML = `
        <p><strong>SSN:</strong> ${c.ssn}</p>
        <p><strong>Name:</strong> ${c.name}</p>
        <p><strong>Email:</strong> ${c.email}</p>
        <p><strong>Contact:</strong> ${c.contact}</p>
        <p><strong>Occupation:</strong> ${c.occupation}</p>
      `;
      document.getElementById("customerModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("customerModal").style.display = "none";
    }

    function showAddCustomerForm() {
      document.getElementById("addCustomerModal").style.display = "flex";
    }

    function closeAddCustomerModal() {
      document.getElementById("addCustomerModal").style.display = "none";
    }

    document.getElementById("addCustomerForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const newCustomer = {
        ssn: document.getElementById("newSSN").value.trim(),
        name: document.getElementById("newName").value.trim(),
        email: document.getElementById("newEmail").value.trim(),
        contact: document.getElementById("newContact").value.trim(),
        occupation: document.getElementById("newOccupation").value.trim()
      };
      customers.push(newCustomer);
      const rowNode = dataTable.row.add([
        newCustomer.ssn,
        `<a href=\"#\" onclick=\"showModal(${customers.length - 1})\">${newCustomer.name}</a>`,
        newCustomer.email,
        newCustomer.contact,
        newCustomer.occupation,
        `<button class=\"delete-btn\" onclick=\"deleteCustomer(${customers.length - 1})\">Delete</button>`
      ]).draw().node();
      closeAddCustomerModal();
      alert("Customer added successfully!");
    });

    function deleteCustomer(index) {
      if (confirm("Are you sure you want to delete this customer?")) {
        customers.splice(index, 1);
        dataTable.clear().draw();
        customers.forEach((c, i) => {
          dataTable.row.add([
            c.ssn,
            `<a href=\"#\" onclick=\"showModal(${i})\">${c.name}</a>`,
            c.email,
            c.contact,
            c.occupation,
            `<button class=\"delete-btn\" onclick=\"deleteCustomer(${i})\">Delete</button>`
          ]);
        });
        dataTable.draw();
      }
    }

    populateTable();
  </script>
</body>
</html>
